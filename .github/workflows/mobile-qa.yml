name: POS mobile QA
on:
  push:
    branches: [fix/mobile-qa-round2-20261101]
  workflow_dispatch:
jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bot_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot_backend/package-lock.json
      - run: npm ci
      - run: node --test tests/mobilePosFixes.test.js
  frontend-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.mobile.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-pos-browser-report
          path: |
            playwright-mobile-report/
            test-results/
          retention-days: 5
