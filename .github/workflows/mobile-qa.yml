name: POS mobile QA
on:
  push:
    branches: [fix/mobile-qa-round2-20261101, fix/pos-p0-review1-20261102]
  workflow_dispatch:
jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bot_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot_backend/package-lock.json
      # The existing bot_backend lockfile is not synchronized with package.json.
      # QA-only install: do not modify production lockfiles.
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: node --check repositories/sales.repo.js
      - run: node --check controllers/sales/createSale.js
      - run: node --check repositories/products.repo.js
      - run: node --test tests/mobilePosFixes.test.js
      - run: npm test
      - name: Real HTTP SQLite smoke in isolated temp database
        shell: bash
        run: |
          set -euo pipefail
          QA_DIR="$(mktemp -d)"
          tar --exclude='./node_modules' --exclude='*.db' --exclude='.env*' --exclude='./backups' -cf - . | tar -xf - -C "$QA_DIR"
          ln -s "$PWD/node_modules" "$QA_DIR/node_modules"
          cd "$QA_DIR"
          PORT=31977 DB_PROVIDER=sqlite TELEGRAM_BOT_TOKEN= JWT_SECRET=qa-test-only node server.js > "$RUNNER_TEMP/pos-smoke-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; rm -rf "$QA_DIR"' EXIT
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:31977/health >/dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:31977/health
          SMOKE_BASE_URL=http://127.0.0.1:31977 node scripts/mobilePosApi.smoke.js
          echo "QA temp database passed; actual repository databases were untouched"
  backend-mongo-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bot_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock=false --no-audit --no-fund
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --rm --name pos-qa-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 45); do
            if docker exec pos-qa-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 1
          done
          docker exec pos-qa-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do
            if docker exec pos-qa-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 1
          done
      - run: node scripts/mobileMongoP0.qa.js
        env:
          QA_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - if: always()
        run: docker rm -f pos-qa-mongo || true
  frontend-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.mobile.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-pos-browser-report
          path: |
            playwright-mobile-report/
            test-results/
          retention-days: 5
